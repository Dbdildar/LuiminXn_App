name: Android DEV

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: development
  cancel-in-progress: true

jobs:
  test:
    name: DEV CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-rn

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js

      - name: Security audit (critical, blocking)
        run: npm audit --omit=dev --audit-level=critical

  build-dev:
    name: Build DEV APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-rn

      # A release build is used on purpose: a debug APK does not contain the
      # JavaScript bundle and would show "Unable to load script" on testers'
      # phones because there is no Metro server to download it from.
      - name: Build DEV APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: dev-${{ github.run_number }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload DEV APK
        uses: actions/upload-artifact@v7
        with:
          name: dev-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  firebase:
    name: Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build-dev
    environment: development
    timeout-minutes: 10
    steps:
      - name: Download DEV APK
        uses: actions/download-artifact@v4
        with:
          name: dev-apk-${{ github.sha }}
          path: release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: qa
          file: release/app-release.apk
          releaseNotes: |
            DEV build #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
